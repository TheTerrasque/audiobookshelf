# Fork: build the Docker image on every push and publish it to GHCR as
#   ghcr.io/<owner>/audiobookshelf:<branch>   e.g. :feat-media-versions
#   ghcr.io/<owner>/audiobookshelf:sha-<short sha>
#   ghcr.io/<owner>/audiobookshelf:latest     (default branch only)
# Uses the workflow's GITHUB_TOKEN, so no secrets are needed. Upstream's
# docker-build.yml only runs in advplyr/audiobookshelf.

name: Build and Push Fork Docker Image

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master # mirrors upstream
    paths:
      - client/**
      - server/**
      - index.js
      - package.json
      - package-lock.json
      - tsconfig.server.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-build-fork.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository != 'advplyr/audiobookshelf' && !contains(github.event.head_commit.message, 'skip ci') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Image name
        id: image
        # GHCR image names must be lowercase
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/audiobookshelf" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
